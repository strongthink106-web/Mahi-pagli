name: Deploy birthday site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate static site
        run: |
          test -s index.html
          test -s assets/app.css
          test -s assets/app.js
          for page in wishes.html letter.html memories.html garden.html cake.html finale.html; do
            test -s "$page"
            grep -q 'assets/app.css' "$page"
          done
          node --check assets/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
